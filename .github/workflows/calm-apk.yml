# Builds the personal "NutriTrace Calm" Android app from this branch and
# attaches the signed APK to a GitHub Release in this fork.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CALM_KEYSTORE_B64  the release keystore, base64-encoded
#   CALM_KEYSTORE_PASS its password (used for both store and key)
# The key alias is "calm". Keep the same keystore for every build: Android
# only installs an update over an app signed with the same key.
name: Calm APK

on:
  workflow_dispatch:
  push:
    branches: [ 'christin-*' ]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # GitHub's ubuntu runners ship the Android SDK (ANDROID_HOME is set),
      # so no SDK setup action is needed; Gradle fetches any missing
      # platform it asks for.
      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Sync into the Android project
        run: npx cap sync android

      - name: Signing config
        env:
          KEYSTORE_B64: ${{ secrets.CALM_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.CALM_KEYSTORE_PASS }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "CALM_KEYSTORE_B64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > android/app/calm.keystore
          {
            echo "storeFile=calm.keystore"
            echo "storePassword=$KEYSTORE_PASS"
            echo "keyAlias=calm"
            echo "keyPassword=$KEYSTORE_PASS"
          } > android/keystore.properties

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          OUT="NutriTrace-Calm-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "tag=calm-${VERSION}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.file }}" \
            --target "$GITHUB_SHA" \
            --title "NutriTrace Calm ${{ steps.apk.outputs.tag }}" \
            --notes "Personal build of branch ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}."

      - name: Remove signing files
        if: always()
        run: rm -f android/app/calm.keystore android/keystore.properties
